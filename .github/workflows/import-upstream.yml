name: Import pinned SM4450 devicetrees source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-upstream.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-sm4450-devicetrees
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout nAa-mist main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import pinned upstream commit as a preserved Git parent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/xiaomi-ravelin/android_kernel_xiaomi_sm4450-devicetrees.git
          git fetch -q --depth=1 upstream da6aa48e7f1ab75dfaff618fa2339940d85d8e04
          test "$(git rev-parse FETCH_HEAD)" = da6aa48e7f1ab75dfaff618fa2339940d85d8e04
          test "$(git ls-tree -r --name-only FETCH_HEAD | wc -l)" -eq 7026
          git merge --no-ff --allow-unrelated-histories \
            -m "Import pinned SM4450 devicetrees source (upstream da6aa48e7f1ab75dfaff618fa2339940d85d8e04)" FETCH_HEAD
          test "$(git diff --name-only da6aa48e7f1ab75dfaff618fa2339940d85d8e04 HEAD -- \
            ':(exclude)README.md' ':(exclude).github/workflows/import-upstream.yml' | wc -l)" -eq 0
          echo "Source content and Git parent verified, with 7026 pinned upstream paths"

      - name: Push verified merged source to nAa-mist
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "Published source to nAa-mist/kernel_xiaomi_sm4450-devicetrees"
