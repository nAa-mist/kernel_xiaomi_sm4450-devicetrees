name: Import pinned SM4450 devicetrees source snapshot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-upstream.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-sm4450-devicetrees
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout canonical nAa-mist main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch verified upstream source commit
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/xiaomi-ravelin/android_kernel_xiaomi_sm4450-devicetrees.git
          git fetch -q --depth=1 upstream da6aa48e7f1ab75dfaff618fa2339940d85d8e04
          test "$(git rev-parse FETCH_HEAD)" = da6aa48e7f1ab75dfaff618fa2339940d85d8e04
          test "$(git ls-tree -r --name-only da6aa48e7f1ab75dfaff618fa2339940d85d8e04 | wc -l)" -eq 7026

      - name: Import and verify the full file snapshot without shallow-history parents
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar da6aa48e7f1ab75dfaff618fa2339940d85d8e04 | tar -xf -
          git add -f -A
          test "$(git diff --cached --name-only | wc -l)" -eq 7026
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.verbose=false commit -q -m "Import pinned SM4450 devicetrees snapshot from da6aa48e7f1ab75dfaff618fa2339940d85d8e04"
          if test -n "$(git diff --name-only da6aa48e7f1ab75dfaff618fa2339940d85d8e04 HEAD -- . ':(exclude)README.md' ':(exclude).github/workflows/import-upstream.yml')"; then
            echo 'Imported snapshot differs from the pinned upstream source' >&2
            exit 1
          fi
          echo "All 7026 upstream files verified against da6aa48e7f1ab75dfaff618fa2339940d85d8e04"

      - name: Push nAa-mist repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo 'Source imported; no stock firmware or proprietary blobs downloaded'
